services:
  redis:
    image: redis:7-alpine
    container_name: dbuff-redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.4
    container_name: dbuff-leetcode-api
    ports:
      - "${LEETCODE_API_PORT:-3005}:3000"
    restart: unless-stopped

volumes:
  redis-data:
